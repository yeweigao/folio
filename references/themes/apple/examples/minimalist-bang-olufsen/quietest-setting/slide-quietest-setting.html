<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>Sound Column — the quietest setting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=Noto+Sans+SC:wght@400&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#f4f3ef; --panel:#ffffff; --dark:#282722; --ink:#282722;
    --muted:#636159; --action:#282722; --onAction:#ffffff; --hairline:#d2d2d7;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#e4e2dc; }
  body { font-family:"Inter","Noto Sans SC",-apple-system,system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .unit { position:relative; width:1600px; height:900px; overflow:hidden; background:var(--canvas); }
  .zh { font-family:"Noto Sans SC","Inter",sans-serif; }
  [data-cc] { position:relative; isolation:isolate; }
  .cc-bg { position:absolute; left:0; top:0; z-index:-1; pointer-events:none; }
  .t { position:absolute; }
  svg { display:block; }

  .mark { left:96px; top:58px; font-size:20px; line-height:1.2; letter-spacing:.2px; }
  .claim { left:96px; top:150px; width:820px; font-size:78px; font-weight:400; line-height:1.05; letter-spacing:-2.2px; }
  .claim-zh { left:96px; top:352px; font-size:25px; line-height:1.5; color:var(--muted); }
  .num { left:96px; top:416px; font-size:112px; line-height:1; letter-spacing:-4px; }
  .num .unitmark { font-size:34px; letter-spacing:0; margin-left:22px; }
  .numlabel { left:100px; top:548px; font-size:17px; line-height:1.5; color:var(--muted); }
  .ctx { left:96px; top:586px; width:640px; font-size:17px; line-height:1.5; }
  .dim { left:1000px; top:466px; width:100px; text-align:right; font-size:12px; line-height:1.4; color:var(--muted); }
  .caption { left:1000px; top:806px; width:520px; font-size:12px; line-height:1.5; color:var(--muted); }
  .foot { left:96px; top:826px; width:1408px; font-size:12px; line-height:1.5; color:var(--muted); }
</style>
</head>
<body>
<div class="unit" id="slide">

  <!-- The object, drawn at one scale: 480 mm tall = 560 px, 96 mm wide = 112 px.
       Aluminium frame, wool front, square edges — the world has no chrome. -->
  <svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true" style="position:absolute;left:0;top:0">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#e6e4dd"/>
        <stop offset=".07" stop-color="#ceccc4"/>
        <stop offset=".17" stop-color="#dedcd5"/>
        <stop offset=".46" stop-color="#bcbab2"/>
        <stop offset=".70" stop-color="#d3d1c9"/>
        <stop offset=".90" stop-color="#aaa89f"/>
        <stop offset="1" stop-color="#918f88"/>
      </linearGradient>
      <linearGradient id="wool" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8b8880"/>
        <stop offset=".30" stop-color="#75726a"/>
        <stop offset=".68" stop-color="#605e57"/>
        <stop offset="1" stop-color="#4d4b45"/>
      </linearGradient>
      <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000000" stop-opacity=".20"/>
        <stop offset="1" stop-color="#000000" stop-opacity="0"/>
      </linearGradient>
      <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="1" fill="#000000" opacity=".11"/>
        <rect x="0" y="0" width="1" height="3" fill="#ffffff" opacity=".07"/>
      </pattern>
      <filter id="soft" x="-80%" y="-400%" width="260%" height="900%">
        <feGaussianBlur stdDeviation="11"/>
      </filter>
    </defs>

    <!-- one shadow, on the object alone -->
    <ellipse cx="1210" cy="772" rx="94" ry="11" fill="#282722" opacity=".13" filter="url(#soft)"/>

    <!-- cabinet -->
    <rect x="1154" y="200" width="112" height="560" fill="url(#metal)"/>

    <!-- wool front, inset 10 mm from each side, 26 mm at the top, 26 mm at the base -->
    <rect x="1164" y="222" width="92" height="516" fill="url(#wool)"/>
    <rect x="1164" y="222" width="92" height="516" fill="url(#weave)"/>
    <rect x="1164" y="222" width="92" height="16" fill="url(#recess)"/>

    <!-- edges: the two lines that make the front read as inset -->
    <rect x="1164" y="222" width="1.5" height="516" fill="#ffffff" opacity=".22"/>
    <rect x="1254.5" y="222" width="1.5" height="516" fill="#000000" opacity=".22"/>

    <!-- top plate and base: aluminium, with a reveal at each joint -->
    <rect x="1154" y="200" width="112" height="1.5" fill="#ffffff" opacity=".40"/>
    <rect x="1154" y="220" width="112" height="2" fill="#000000" opacity=".20"/>
    <rect x="1154" y="224" width="112" height="1" fill="#ffffff" opacity=".26"/>
    <rect x="1154" y="736" width="112" height="2" fill="#000000" opacity=".18"/>
    <rect x="1154" y="740" width="112" height="1" fill="#ffffff" opacity=".22"/>
    <rect x="1154" y="758" width="112" height="2" fill="#000000" opacity=".14"/>

    <!-- side returns -->
    <rect x="1154" y="200" width="2" height="560" fill="#ffffff" opacity=".26"/>
    <rect x="1264" y="200" width="2" height="560" fill="#000000" opacity=".16"/>
  </svg>

  <!-- dimension line: the drawing is to scale, so the number can be trusted -->
  <svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true" style="position:absolute;left:0;top:0">
    <g stroke="#b9b7ae" stroke-width="1">
      <line x1="1104" y1="200" x2="1104" y2="760"/>
      <line x1="1096" y1="200" x2="1112" y2="200"/>
      <line x1="1096" y1="760" x2="1112" y2="760"/>
    </g>
  </svg>
  <p class="t dim">480 mm</p>

  <p class="t mark">Sound</p>

  <h1 class="t claim pad">The room is quieter
than the speaker.</h1>
  <p class="t claim-zh zh">房间比音箱更安静</p>

  <p class="t num">30<span class="unitmark">dB</span></p>
  <p class="t numlabel">lowest setting, at one metre</p>
  <p class="t ctx">Room tone 28 dB. Two decibels is the whole gap.</p>

  <!-- The proof: a linear dB SPL scale, 24 to 40, with the room and the
       speaker's floor marked and the gap drawn as a bar. -->
  <svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true" style="position:absolute;left:0;top:0">
    <text x="271" y="652" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#282722">2 dB</text>
    <rect x="236" y="668" width="70" height="6" fill="#282722"/>

    <line x1="96" y1="690" x2="656" y2="690" stroke="#d2d2d7" stroke-width="1"/>
    <g stroke="#d2d2d7" stroke-width="1">
      <line x1="96" y1="684" x2="96" y2="696"/>
      <line x1="376" y1="684" x2="376" y2="696"/>
      <line x1="656" y1="684" x2="656" y2="696"/>
    </g>
    <g stroke="#282722" stroke-width="1.5">
      <line x1="236" y1="670" x2="236" y2="700"/>
      <line x1="306" y1="670" x2="306" y2="700"/>
    </g>

    <g font-family="Inter, sans-serif" font-size="12" fill="#636159" text-anchor="middle">
      <text x="96" y="716">24</text>
      <text x="376" y="716">32</text>
      <text x="656" y="716">40</text>
    </g>
    <g font-family="Inter, sans-serif" font-size="12" fill="#282722" text-anchor="middle">
      <text x="236" y="716">28</text>
      <text x="306" y="716">30</text>
    </g>
    <text x="96" y="748" font-family="Inter, sans-serif" font-size="12" fill="#636159">dB SPL</text>
  </svg>

  <p class="t caption">Illustrative render, not a photograph</p>
  <p class="t foot">Illustrative example</p>
</div>
<script src="../../_shared/continuous-corner.js"></script>
</body>
</html>
