<aside class="panel"><h2>Choose a configuration</h2><section class="group"><h3>Battery <span class="zhsmall">电池</span></h3><label class="choice"><span class="label"><input data-apple-motion type="radio" name="battery" value="0">Standard 402 km</span><span class="delta">Included</span></label><label class="choice selected"><span class="label"><input data-apple-motion type="radio" name="battery" value="12000" checked>Long range 560 km</span><span class="delta">+¥12,000</span></label></section><section class="group"><h3>Wheels <span class="zhsmall">轮毂</span></h3><label class="choice selected"><span class="label"><input data-apple-motion type="radio" name="wheels" value="0" checked>16-inch Aero</span><span class="delta">Included</span></label><label class="choice"><span class="label"><input data-apple-motion type="radio" name="wheels" value="4800">18-inch Turbine</span><span class="delta">+¥4,800</span></label></section><section class="group"><h3>Finish <span class="zhsmall">车色</span></h3><label class="choice selected"><span class="label"><input data-apple-motion type="radio" name="finish" value="0" checked><i class="swatch" style="background:#bfc3c5"></i>Ash</span><span class="delta">Included</span></label><label class="choice"><span class="label"><input data-apple-motion type="radio" name="finish" value="2200"><i class="swatch" style="background:#737b83"></i>Pewter</span><span class="delta">+¥2,200</span></label><label class="choice"><span class="label"><input data-apple-motion type="radio" name="finish" value="3600"><i class="swatch" style="background:#24272c"></i>Carbon</span><span class="delta">+¥3,600</span></label></section></aside>
<div class="foot">Illustrative example</div><div class="total"><div><small id="breakdown">Base ¥80,400 + ¥12,000 Long range</small><strong id="amount">¥92,400</strong></div><a data-apple-motion class="reserve" href="#reserve">Reserve</a></div></main><script>
document.querySelectorAll('.choice input').forEach(input=>input.addEventListener('change',()=>{document.querySelectorAll('.choice').forEach(row=>row.classList.toggle('selected',row.querySelector('input').checked));let extras=[...document.querySelectorAll('.choice input:checked')].reduce((sum,item)=>sum+Number(item.value),0);document.getElementById('amount').textContent='¥'+(80400+extras).toLocaleString('en-US');let battery=document.querySelector('input[name="battery"]:checked');document.getElementById('breakdown').textContent=battery.value==='12000'?'Base ¥80,400 + ¥12,000 Long range':'Base ¥80,400 · Standard 402 km';}));
