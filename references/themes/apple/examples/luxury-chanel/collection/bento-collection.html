<html lang="en">
<head>

<title>Noir — The Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&amp;family=Inter:wght@400;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+SC:wght@400&amp;display=swap" rel="stylesheet">
<style>
:root{--canvas:#fff;--panel:#f5f5f5;--ink:#111;--muted:#626262;--hair:#d2d2d7;--dark:#111}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#fff}body{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}.unit{position:relative;width:1440px;height:1000px;overflow:hidden;background:#fff}.serif{font-family:"Cormorant Garamond","Noto Serif SC",Georgia,serif}.zh{font-family:"Noto Serif SC","Noto Sans SC",serif}.t{position:absolute}svg{display:block}[data-cc]{position:relative;isolation:isolate}.cc-bg{position:absolute;left:0;top:0;z-index:-1;pointer-events:none}a{text-decoration:none}
.header{left:80px;top:32px;width:1280px;display:flex;align-items:baseline;justify-content:space-between}.sig{display:flex;align-items:baseline;gap:24px}.sig .brand{font-size:29px;font-weight:600}.sig .series,.sig .zhline{font-size:16px;color:var(--muted)}.header a{font-size:15px;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:3px}
.title{left:80px;top:100px;width:1280px}.title h1{font-size:72px;line-height:.98;font-weight:400;letter-spacing:-.015em}.title p{margin-top:8px;font-size:25px;color:var(--muted)}
.gallery{left:80px;top:242px;width:1280px;height:550px;display:grid;grid-template-columns:760px 1fr;gap:24px}.lead{display:grid;grid-template-columns:1fr 1fr;align-items:center;border-right:1px solid var(--hair);padding-right:24px}.lead .figure{height:500px;display:flex;align-items:center;justify-content:center}.lead .figure svg{width:100%;height:100%}.lead .meta{padding:0 10px 0 18px}.lead .name{font-size:28px;font-weight:600}.lead .price{margin-top:8px;font-size:20px;color:var(--muted)}.support{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:16px}.item{display:flex;flex-direction:column;justify-content:space-between;min-width:0;padding:12px;border-bottom:1px solid var(--hair)}.item .art{height:165px;display:flex;align-items:center;justify-content:center}.item .art svg{width:100%;height:100%}.item .name{font-size:20px;font-weight:600}.item .price{margin-top:5px;font-size:17px;color:var(--muted)}
.footer{left:0;top:830px;width:1440px;height:170px;background:#111;color:#fff;padding:18px 80px 14px;display:flex;flex-direction:column;justify-content:space-between}.close{display:flex;align-items:center;justify-content:space-between}.count{display:flex;align-items:baseline;gap:18px}.count .num{font:64px/.9 "Cormorant Garamond","Noto Serif SC",serif}.count .label{font-size:24px}.close a{height:44px;padding:0 25px;display:flex;align-items:center;border:1px solid rgba(255,255,255,.65);color:#fff;font-size:16px}.fine{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#c8c8c8}
</style><link rel="stylesheet" href="../../_shared/apple-interactions.css">
<style data-review-reflow>

:root{--apple-focus:#111111}
@media(max-width:1440px){
 .unit{position:relative;width:min(100%,1440px);min-height:100vh;height:auto;overflow:visible;margin:0 auto;padding:32px clamp(24px,5.55vw,80px) 0;display:flex;flex-direction:column;gap:18px}
 .t{position:static;left:auto;top:auto;width:auto;height:auto}
 .header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}.sig{gap:16px;flex-wrap:wrap}.sig .brand{font-size:26px}.sig .series,.sig .zhline{font-size:15px}
 .title h1{font-size:clamp(42px,5.6vw,72px);line-height:1.04;letter-spacing:-.035em}.title p{font-size:20px}
 .gallery{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;height:auto}
 .lead{min-width:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-right:18px}.lead .figure{height:470px;min-width:0}.lead .meta{padding:0 0 0 12px}.lead .name{font-size:23px}.lead .price{font-size:17px}
 .support{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}.item{min-width:0;padding:10px}.item .art{height:150px}.item .name{font-size:18px}.item .price{font-size:16px}
 .footer{position:static;left:auto;top:auto;width:auto;height:auto;min-height:120px;margin:0 -1px;padding:18px clamp(24px,5.55vw,80px) 14px;gap:16px}
 .count .num{font-size:56px}.count .label{font-size:20px}.close a{min-height:44px}
 .fine{font-size:13px;gap:10px;flex-wrap:wrap}
}
@media(max-width:850px){
 .unit{gap:16px}.gallery{grid-template-columns:minmax(0,1fr);gap:16px}.lead{grid-template-columns:minmax(0,1fr) minmax(0,.8fr);border-right:0;border-bottom:1px solid var(--hair);padding:0 0 18px}.lead .figure{height:380px}.support{grid-template-rows:repeat(2,minmax(190px,auto))}.item .art{height:130px}
}
@media(max-width:520px){
 .unit{padding:24px 20px 0;gap:14px}.sig{gap:8px 14px}.sig .brand{font-size:23px}.sig .series,.sig .zhline{font-size:14px}
 .title h1{font-size:39px}.title p{font-size:18px}
 .gallery{gap:12px}.lead{grid-template-columns:minmax(0,1fr);padding-bottom:14px}.lead .figure{height:300px}.lead .meta{padding:0 4px;display:grid;grid-template-columns:1fr auto;gap:8px}.lead .name{font-size:20px}.lead .price{font-size:16px}
 .support{grid-template-columns:minmax(0,1fr);grid-template-rows:none}.item{min-height:220px;padding:10px 4px}.item .art{height:150px}.item .name{font-size:18px}
 .footer{margin:0 -20px;min-height:0;padding:16px 20px 14px}.close{align-items:flex-start;gap:12px;flex-wrap:wrap}.count{gap:12px}.count .num{font-size:48px}.count .label{font-size:17px}.fine{font-size:12px;flex-direction:column;align-items:flex-start}
}

</style>
</head>
