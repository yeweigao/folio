<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noir — The One Seam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&amp;family=Inter:wght@400;600&amp;family=Noto+Serif+SC:wght@400&amp;family=Noto+Sans+SC:wght@400&amp;display=swap" rel="stylesheet">
<style>
:root{--canvas:#fff;--panel:#f3f3f3;--dark:#111;--ink:#111;--muted:#626262;--hair:#d2d2d7}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#fff}body{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}.unit{position:relative;width:1600px;height:900px;overflow:hidden;background:#fff}.serif{font-family:"Cormorant Garamond","Noto Serif SC",Georgia,serif}.zh{font-family:"Noto Serif SC","Noto Sans SC",serif}.t{position:absolute}.pad{padding:12px}svg{display:block}[data-cc]{position:relative;isolation:isolate}.cc-bg{position:absolute;left:0;top:0;z-index:-1;pointer-events:none}a{text-decoration:none}
.brand{left:76px;top:40px}.brand .name{font-size:29px;font-weight:600}.brand .sub{margin-top:3px;font-size:16px;color:var(--muted)}.brand .zhline{font-size:15px;color:var(--muted)}.claim{left:76px;top:139px;width:685px;font-size:82px;line-height:.96;font-weight:400;letter-spacing:-.02em}.claimzh{left:76px;top:458px;font-size:28px;color:var(--muted)}.action{left:76px;top:548px;height:50px;width:max-content;padding:0 28px;display:flex;align-items:center;background:#111;color:#fff;font-size:17px}.action span{position:relative;z-index:1}.jacket{left:815px;top:42px;width:680px;height:588px}.proof{left:800px;top:639px;width:720px;height:190px;background:#111;color:#fff;padding:20px 26px;transform:translateZ(0)}.proof h2{font:27px/1.1 "Cormorant Garamond","Noto Serif SC",serif}.labels{margin-top:14px;display:flex;justify-content:space-between;font-size:17px;color:#dedede}.dim{position:absolute;left:294px;top:48px;text-align:center}.dim strong{display:block;font-size:42px;font-weight:400;line-height:1}.dim span{font-size:16px;color:#d1d1d1}.foot{left:76px;top:836px;width:1448px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
</style><link rel="stylesheet" href="../../_shared/apple-interactions.css">
<style data-review-reflow>

:root{--apple-focus:#111111}
@media(max-width:1600px){
 .unit{position:relative;width:min(100%,1440px);min-height:100vh;height:auto;overflow:visible;margin:0 auto;padding:32px clamp(24px,5vw,76px) 22px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);grid-template-rows:auto auto auto auto auto auto;gap:16px 28px;align-content:start}
 .brand,.claim,.claimzh,.action,.jacket,.proof,.foot{position:static;left:auto;top:auto;width:auto;height:auto}
 .brand{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.brand .name{font-size:25px}.brand .sub,.brand .zhline{font-size:15px}
 .claim{grid-column:1;grid-row:2;font-size:clamp(52px,6.8vw,82px);line-height:1.02;letter-spacing:-.035em;align-self:end}
 .claimzh{grid-column:1;grid-row:3;font-size:20px}.action{grid-column:1;grid-row:4;min-height:48px;justify-self:start;padding:0 24px}
 .jacket{grid-column:2;grid-row:2/5;display:block;width:100%;aspect-ratio:680/588;align-self:center}
 .proof{grid-column:1/-1;grid-row:5;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"heading heading" "diagram dimension" "labels labels";align-items:center;gap:10px 24px;width:auto;height:auto;min-height:190px;padding:20px 24px;transform:none}
 .proof h2{grid-area:heading;font-size:24px}.proof>svg{grid-area:diagram;display:block;width:100%;max-width:660px;height:auto;aspect-ratio:660/76}
 .labels{grid-area:labels;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:16px;line-height:1.4}
 .dim{grid-area:dimension;position:static;left:auto;top:auto;text-align:right;min-width:120px}.dim strong{font-size:34px}.dim span{font-size:14px}
 .foot{grid-column:1/-1;grid-row:6;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
}
@media(max-width:800px){
 .unit{display:flex;flex-direction:column;gap:16px;padding:28px clamp(24px,5vw,40px) 22px}
 .brand,.claim,.claimzh,.action,.jacket,.proof,.foot{width:auto;margin:0}
 .claim{font-size:clamp(48px,8vw,68px);align-self:stretch;text-align:left}.jacket{width:100%;max-width:680px;align-self:center}
 .proof{min-height:0;padding:18px}.proof>svg{max-width:100%}.labels{font-size:15px}
}
@media(max-width:520px){
 .unit{padding:24px 20px;gap:14px}.brand{gap:7px 12px}.brand .name{font-size:23px}.claim{font-size:40px;letter-spacing:-1px}.claimzh{font-size:18px}.action{min-height:44px;font-size:16px}
 .proof{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"heading heading" "diagram diagram" "dimension dimension" "labels labels";gap:10px;padding:16px}.proof h2{font-size:21px}.proof>svg{width:100%}.dim{text-align:left}.dim strong{font-size:30px}.labels{font-size:13px;gap:6px}.foot{font-size:13px;flex-direction:column}
}

</style>
</head>

</div><script src="../../_shared/continuous-corner.js"></script></body></html>
