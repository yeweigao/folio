<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>Noir — The One Seam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&amp;family=Inter:wght@300;400;600&amp;family=Noto+Sans+SC:wght@300;400;600&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#ffffff; --panel:#f5f5f5; --dark:#111111; --ink:#111111;
    --muted:#626262; --action:#111111; --onAction:#ffffff; --onDark:#ffffff;
    --hairline:#d2d2d7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#dedee2;}
  body{font-family:"Inter","Noto Sans SC",-apple-system,system-ui,sans-serif;color:var(--ink);}
  .unit{position:relative;width:1600px;height:900px;overflow:hidden;background:var(--canvas);}
  .serif{font-family:"Cormorant Garamond","Noto Serif SC",serif;}
  .zh{font-family:"Noto Serif SC","Noto Sans SC",serif;}
  .t{position:absolute;}
  .pad{padding:12px;}

  .brand{left:76px;top:44px;}
  .brand .wm{font-size:34px;font-weight:400;letter-spacing:.4px;line-height:1;}
  .brand .sub{margin-top:10px;font-size:14px;line-height:1.4;color:var(--muted);}
  .brand .zhline{margin-top:2px;font-size:14px;line-height:1.4;color:var(--muted);}

  .claim{left:76px;top:140px;width:1440px;font-size:64px;font-weight:400;line-height:1.06;letter-spacing:-.6px;}
  .claim .zhsub{display:block;margin-top:20px;font-size:24px;font-weight:400;line-height:1.5;letter-spacing:0;color:var(--muted);}

  .hairline{left:88px;top:672px;width:1424px;height:1px;background:var(--hairline);}
  .secttl{left:88px;top:688px;width:520px;font-family:"Cormorant Garamond","Noto Serif SC",serif;font-size:26px;font-weight:400;line-height:1.25;}

  .lbl{font-size:12px;line-height:1.4;color:var(--muted);}
  .lblOuter{left:200px;top:760px;width:96px;}
  .lblInner{left:590px;top:760px;width:96px;}
  .lblSeam{left:486px;top:812px;width:148px;text-align:center;}

  .dimnum{left:518px;top:704px;width:84px;text-align:center;font-size:15px;font-weight:600;white-space:nowrap;}
  .dimlbl{left:605px;top:710px;font-size:12px;line-height:1.4;color:var(--muted);}

  .pillwrap{left:1226px;top:754px;}
  .pill{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 28px;font-size:17px;font-weight:400;color:var(--onAction);}

  .cap{left:76px;top:838px;font-size:12px;line-height:1.5;color:var(--muted);}
  .foot{left:76px;top:860px;font-size:12px;line-height:1.5;color:var(--muted);}

  svg{display:block;}
  [data-cc]{position:relative;isolation:isolate}
  .cc-bg{position:absolute;left:0;top:0;z-index:-1;pointer-events:none}
</style>
</head>
<body>
<div class="unit" id="slide">

  <!-- One garment as a silhouette, and the seam opened as a readable
       section. Both are illustrative stand-ins, declared in the caption. -->
  <svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true" style="position:absolute;left:0;top:0">
    <g transform="translate(677 350) scale(0.615)">
      <!-- body: shoulders, sleeves, hem -->
      <path d="M 118 28 C 104 28 96 34 90 46 L 40 250 L 72 258 L 108 122 L 94 500 L 306 500 L 292 122 L 328 258 L 360 250 L 310 46 C 304 34 296 28 282 28 Z" fill="#111111"/>
      <!-- collar, opened -->
      <path d="M 118 28 L 200 98 L 282 28" fill="none" stroke="#626262" stroke-width="3"/>
      <path d="M 118 28 L 200 98 L 158 124 L 126 64 Z" fill="#ffffff" opacity=".10"/>
      <path d="M 282 28 L 200 98 L 242 124 L 274 64 Z" fill="#ffffff" opacity=".10"/>
      <!-- lit side of the front -->
      <path d="M 94 500 L 108 122 L 200 98 L 200 500 Z" fill="#ffffff" opacity=".035"/>
      <!-- centre front, closed -->
      <path d="M 200 98 V 500" stroke="#d2d2d7" stroke-width="2" opacity=".6"/>
      <!-- sleeve cuffs -->
      <path d="M 78 214 L 112 228 M 322 214 L 288 228" stroke="#626262" stroke-width="2" opacity=".5"/>
      <!-- two pockets, level -->
      <path d="M 120 356 H 184 M 216 356 H 280" stroke="#626262" stroke-width="2" opacity=".45"/>
      <!-- hem shadow -->
      <path d="M 94 500 H 306" stroke="#626262" stroke-width="2" opacity=".5"/>
    </g>

    <!-- the seam, cut open: two panels, one welted join, one dimension -->
    <g transform="translate(60 0)">
    <rect x="140" y="744" width="330" height="44" fill="#f5f5f5" stroke="#111111" stroke-opacity=".22" stroke-width="1"/>
    <rect x="530" y="744" width="330" height="44" fill="#f5f5f5" stroke="#111111" stroke-opacity=".22" stroke-width="1"/>
    <path d="M 470 744 V 796 C 470 802 476 804 482 804 H 518 C 524 804 530 802 530 796 V 744" fill="none" stroke="#111111" stroke-width="2"/>

    <!-- 6 mm across the allowance -->
    <path d="M 470 728 H 530" stroke="#111111" stroke-width="1" opacity=".55"/>
    <path d="M 470 728 V 744 M 530 728 V 744" stroke="#111111" stroke-width="1" opacity=".55"/>
    </g>
  </svg>

  <div class="t brand pad">
    <div class="wm serif">Noir</div>
    <div class="sub">The One Seam</div>
    <div class="zhline zh">一道缝</div>
  </div>

  <h1 class="t claim pad serif">Black and white leave
<br>the cut nowhere to hide.<span class="zhsub zh">黑白之间，剪裁无处可藏</span></h1>

  <div class="t hairline"></div>
  <div class="t secttl pad">A section through the one seam</div>

  <div class="t lbl lblOuter pad">outer face</div>
  <div class="t lbl lblInner pad">inner face</div>
  <div class="t lbl lblSeam pad">the one seam</div>
  <div class="t dimnum pad">6 mm</div>
  <div class="t dimlbl pad">seam allowance</div>

  <div class="t pillwrap pad"><span class="pill" data-cc="23" data-cc-fill="#111111">See the construction</span></div>

  <div class="t cap pad">Illustrative render, not a photograph</div>
  <div class="t foot pad">Illustrative example</div>
</div>
<script src="../../_shared/continuous-corner.js"></script>
</body>
</html>
