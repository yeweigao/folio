<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Atelier — The range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&amp;family=Inter:wght@400;600&amp;family=Noto+Serif+SC:wght@400;600&amp;family=Noto+Sans+SC:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#ffffff; --panel:#f7f3eb; --dark:#24211d; --ink:#24211d;
    --muted:#67615a; --action:#a74b00; --onAction:#ffffff; --hairline:#d2d2d7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e7e5e1}
  body{font-family:"Inter","Noto Sans SC",-apple-system,system-ui,sans-serif;color:var(--ink)}
  .unit{position:relative;width:1440px;height:1000px;overflow:hidden;background:var(--canvas)}
  .serif{font-family:"Cormorant Garamond","Noto Serif SC",Georgia,serif}
  .zhserif{font-family:"Noto Serif SC","Cormorant Garamond",serif}
  .zh{font-family:"Noto Sans SC","Inter",sans-serif}
  .pad{padding:12px}
  .t{position:absolute}
  [data-cc]{position:relative;isolation:isolate}
  .cc-bg{position:absolute;left:0;top:0;z-index:-1;pointer-events:none}
  svg{display:block}
  a{text-decoration:none}

  .nav{left:80px;top:0;width:1280px;height:56px;display:flex;align-items:center;justify-content:space-between}
  .mark{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600}
  .enquire{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 28px;
    font-size:17px;font-weight:400;color:var(--onAction)}

  .title{left:80px;top:76px;width:1280px;display:flex;align-items:baseline;gap:24px}
  .title h1{font-family:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
    font-size:46px;font-weight:400;line-height:1.1}
  .title .zhsub{font-size:21px;font-weight:400;color:var(--muted)}

  .grid{left:80px;top:176px;width:1280px;height:660px;
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:340px 304px;gap:16px}
  .tile{display:flex;flex-direction:column;overflow:hidden}
  .tile .art{flex:1;min-height:0;overflow:hidden}
  .tile .art svg{width:100%;height:100%}
  .tile .meta{padding:0 0 4px 0}
  .tile .nm{font-size:17px;font-weight:600;letter-spacing:normal}
  .tile .pr{font-size:17px;font-weight:400;color:var(--muted);margin-top:4px;letter-spacing:normal}
  .tile .clm{font-size:15px;font-weight:400;color:var(--muted);margin-top:12px;line-height:1.5;letter-spacing:normal}

  .lead{grid-column:1 / 3;grid-row:1 / 3;padding:28px}
  .lead .nm{font-family:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
    font-size:42px;font-weight:400;line-height:1.1}
  .lead .art{margin:8px 0 22px 0}

  .poster{grid-column:3;grid-row:1;padding:28px;justify-content:space-between}
  .poster .big{font-family:"Cormorant Garamond",Georgia,serif;font-size:132px;font-weight:400;line-height:1}
  .poster .pl{font-size:14px;font-weight:600;letter-spacing:normal}
  .poster .pc{font-size:14px;font-weight:400;color:var(--muted);line-height:1.6;margin-top:10px;letter-spacing:normal}

  .small{padding:24px}
  .small .meta{margin-top:16px}

  .cap{left:80px;top:856px;width:1280px;font-size:14px;font-weight:400;color:var(--muted);letter-spacing:normal}
  .foot{left:80px;top:920px;width:1280px;display:flex;justify-content:space-between;
    font-size:12px;font-weight:400;color:var(--muted);letter-spacing:normal}
</style>
</head>
<body>
<div class="unit" id="page">

  <div class="t nav">
    <span class="mark">Atelier</span>
    <a class="enquire" href="#" data-cc="22" data-cc-fill="#a74b00">Enquire</a>
  </div>

  <div class="t title pad">
    <h1>The leather series</h1>
    <span class="zhsub zhserif">皮具系列</span>
  </div>

  <div class="t grid">

    <div class="tile lead" data-cc="18" data-cc-fill="#f7f3eb" data-cc-clip>
      <div class="art">
        <svg viewBox="0 0 576 452" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="baghide" x1="0" y1="0" x2=".2" y2="1">
              <stop offset="0" stop-color="#e9e0cf"/>
              <stop offset=".55" stop-color="#d3c7b2"/>
              <stop offset="1" stop-color="#b4a691"/>
            </linearGradient>
          </defs>
          <path d="M212 132 C212 66 364 66 364 132" fill="none" stroke="#5c5245" stroke-width="13"/>
          <path d="M92 132 L484 132 L508 404 L68 404 Z" fill="url(#baghide)"/>
          <path d="M92 132 L484 132 L476 224 L100 224 Z" fill="#ddd1bd"/>
          <path d="M100 224 L476 224" stroke="#8a7f6e" stroke-width="2" opacity=".55"/>
          <g stroke="#4a4136" stroke-width="4" stroke-linecap="round">
            <line x1="116" y1="212" x2="132" y2="226"/><line x1="160" y1="212" x2="176" y2="226"/>
            <line x1="204" y1="212" x2="220" y2="226"/><line x1="248" y1="212" x2="264" y2="226"/>
            <line x1="292" y1="212" x2="308" y2="226"/><line x1="336" y1="212" x2="352" y2="226"/>
            <line x1="380" y1="212" x2="396" y2="226"/><line x1="424" y1="212" x2="440" y2="226"/>
          </g>
          <rect x="274" y="206" width="28" height="26" fill="#3a342c"/>
          <rect x="280" y="212" width="16" height="6" fill="#8a7f6e" opacity=".7"/>
          <path d="M92 132 L68 404 L96 404 L118 132 Z" fill="#000000" opacity=".07"/>
          <path d="M484 132 L508 404 L480 404 L458 132 Z" fill="#000000" opacity=".07"/>
          <rect x="68" y="398" width="440" height="6" fill="#3a342c" opacity=".8"/>
        </svg>
      </div>
      <div class="meta">
        <p class="nm">The Solstice</p>
        <p class="clm">One bag, one hide, one hand.</p>
        <p class="pr">¥12,800</p>
      </div>
    </div>

    <div class="tile poster" data-cc="18" data-cc-fill="#f7f3eb" data-cc-clip>
      <div class="big">9</div>
      <div>
        <p class="pl">stitches per centimetre</p>
        <p class="pc">one saddle seam, set by hand</p>
      </div>
    </div>

    <div class="tile small" data-cc="18" data-cc-fill="#f7f3eb" data-cc-clip>
      <div class="art">
        <svg viewBox="0 0 260 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <rect width="260" height="170" fill="#ddd1bd"/>
          <path d="M0 0 L260 0 L260 170 L0 170 Z" fill="#e9e0cf" opacity=".5"/>
          <path d="M0 108 L260 78" stroke="#8a7f6e" stroke-width="2" opacity=".55"/>
          <g stroke="#4a4136" stroke-width="4" stroke-linecap="round">
            <line x1="24" y1="98" x2="40" y2="114"/><line x1="70" y1="92" x2="86" y2="108"/>
            <line x1="116" y1="86" x2="132" y2="102"/><line x1="162" y1="80" x2="178" y2="96"/>
            <line x1="208" y1="74" x2="224" y2="90"/>
          </g>
          <rect x="0" y="158" width="260" height="12" fill="#3a342c"/>
        </svg>
      </div>
      <div class="meta"><p class="nm">The Folio</p><p class="pr">¥3,400</p></div>
    </div>

    <div class="tile small" data-cc="18" data-cc-fill="#f7f3eb" data-cc-clip>
      <div class="art">
        <svg viewBox="0 0 260 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <rect width="260" height="170" fill="#d3c7b2"/>
          <rect x="0" y="40" width="260" height="90" fill="#c1b29a"/>
          <rect x="0" y="40" width="260" height="7" fill="#8a7f6e" opacity=".7"/>
          <rect x="0" y="123" width="260" height="7" fill="#8a7f6e" opacity=".7"/>
          <g fill="#3a342c">
            <circle cx="46" cy="85" r="7"/><circle cx="86" cy="85" r="7"/>
            <circle cx="126" cy="85" r="7"/>
          </g>
          <g stroke="#4a4136" stroke-width="3" stroke-linecap="round">
            <line x1="20" y1="52" x2="34" y2="64"/><line x1="60" y1="52" x2="74" y2="64"/>
            <line x1="100" y1="52" x2="114" y2="64"/><line x1="140" y1="52" x2="154" y2="64"/>
            <line x1="180" y1="52" x2="194" y2="64"/><line x1="220" y1="52" x2="234" y2="64"/>
          </g>
        </svg>
      </div>
      <div class="meta"><p class="nm">The Cord</p><p class="pr">¥2,100</p></div>
    </div>

    <div class="tile small" data-cc="18" data-cc-fill="#f7f3eb" data-cc-clip>
      <div class="art">
        <svg viewBox="0 0 260 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <rect width="260" height="170" fill="#e9e0cf"/>
          <path d="M30 34 L230 34 L244 140 L16 140 Z" fill="#d3c7b2"/>
          <path d="M30 34 L230 34 L234 62 L26 62 Z" fill="#c1b29a"/>
          <path d="M26 62 L234 62" stroke="#8a7f6e" stroke-width="2" opacity=".6"/>
          <g stroke="#4a4136" stroke-width="3.5" stroke-linecap="round">
            <line x1="40" y1="56" x2="52" y2="68"/><line x1="76" y1="56" x2="88" y2="68"/>
            <line x1="112" y1="56" x2="124" y2="68"/><line x1="148" y1="56" x2="160" y2="68"/>
            <line x1="184" y1="56" x2="196" y2="68"/><line x1="220" y1="56" x2="232" y2="68"/>
          </g>
          <rect x="112" y="96" width="36" height="22" fill="#3a342c"/>
          <rect x="16" y="134" width="228" height="6" fill="#3a342c" opacity=".75"/>
        </svg>
      </div>
      <div class="meta"><p class="nm">The Keepsake</p><p class="pr">¥4,600</p></div>
    </div>

  </div>

  <p class="t cap pad">Illustrative render, not a photograph</p>
  <div class="t foot pad"><span>Illustrative example</span><span>Atelier series · 2026</span></div>
</div>
<script src="../../_shared/continuous-corner.js"></script>
</body>
</html>
