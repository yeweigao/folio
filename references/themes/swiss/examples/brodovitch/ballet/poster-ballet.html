<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜行 · Night Journey — 江城芭蕾舞团独舞之夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --paper:#F6F7F7; --muted:#55585C;
    --serif:"Noto Serif SC","Bodoni Moda",serif;
    --grot:"Hanken Grotesk","Noto Sans SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#E8E9E9;}
  .unit{position:relative;width:900px;height:1200px;background:var(--paper);color:var(--ink);overflow:hidden;}

  /* The plate: bleeds top, left, right. Its lower edge is not a fraction of the
     format — it is the jeté's own line: through the hip and the front pointe,
     grazing the back leg's underside and lying along the front leg.
     In poster px the edge runs (0,282) -> (900,440). */
  .plate{position:absolute;left:0;top:0;width:900px;height:450px;overflow:hidden;background:var(--ink);
    clip-path:polygon(0 0,100% 0,100% 97.78%,0 62.67%);}
  .plate img{width:100%;height:100%;object-fit:cover;display:block;}

  /* The declaration: on the plate, inside its frame, black on paper at facts
     size — it travels with the plate. It sits in the plate's dark upper-left
     field; the seam itself carries no furniture because the seam is the legs. */
  .decl{position:absolute;left:44px;top:36px;width:560px;background:var(--paper);color:var(--ink);
    font-family:var(--grot);font-weight:500;font-size:26px;line-height:1.35;padding:12px 16px 14px;}

  /* The word: one word, two registered copies, cut by the same line as the
     plate. Local seam in the 800x400 word box: (0,130) -> (800,270). */
  .wordbox{position:absolute;left:50px;top:185px;width:800px;height:400px;}
  .word{position:absolute;left:0;top:0;width:800px;font-family:var(--serif);font-weight:900;
    font-size:400px;line-height:1;white-space:nowrap;}
  .word.paper{color:var(--paper);clip-path:polygon(0 0,100% 0,100% 61.4%,0 26.4%);}
  .word.ink{color:var(--ink);clip-path:polygon(0 26.4%,100% 61.4%,100% 100%,0 100%);}

  /* The page: set from the bottom margin up. One tight table measure: the
     values column starts at 200px — a quarter division of the word's span. */
  .page{position:absolute;left:50px;right:50px;bottom:50px;}
  .nj{font-family:var(--grot);font-weight:500;font-size:27px;line-height:1.4;color:var(--muted);}
  .ptitle{font-family:var(--serif);font-weight:700;font-size:41px;line-height:1.22;color:var(--ink);margin-top:14px;}
  .rule{height:2px;background:var(--ink);margin:25px 0 30px 0;}
  .rows{display:flex;flex-direction:column;gap:22px;}
  .row{display:flex;align-items:baseline;font-family:var(--grot);line-height:38px;}
  .row .lab{flex:0 0 200px;font-weight:500;font-size:24px;color:var(--muted);}
  .row .val{font-weight:700;font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="unit">
  <div class="plate">
    <img src="plate.jpg" alt="独舞者在黑暗舞台上跃起的黑白影像（AI 生成示意）">
    <div class="decl">影像为 AI 生成示意 · 非林晚舟本人<br>AI-generated image — not the named dancer</div>
  </div>

  <div class="wordbox" aria-label="夜行">
    <div class="word paper" aria-hidden="true">夜行</div>
    <div class="word ink" aria-hidden="true">夜行</div>
  </div>

  <div class="page">
    <div class="nj">Night Journey</div>
    <div class="ptitle">芭蕾舞团独舞之夜</div>
    <div class="rule"></div>
    <div class="rows">
      <div class="row"><span class="lab">日期</span><span class="val">2026年12月11日、12日 19:30</span></div>
      <div class="row"><span class="lab">地点</span><span class="val">大剧院</span></div>
      <div class="row"><span class="lab">票价</span><span class="val">¥180–580</span></div>
      <div class="row"><span class="lab">首席舞者</span><span class="val">林晚舟</span></div>
      <div class="row"><span class="lab">出品</span><span class="val">江城芭蕾舞团</span></div>
    </div>
  </div>
</div>
</body>
</html>
