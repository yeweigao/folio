<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三脚凳组装说明</title>
<style>
@font-face { font-family:"Archivo"; src:url("archivo-var.woff2") format("woff2"); font-weight:100 900; font-stretch:62% 125%; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#E3E4E0; }
.sheet { position:relative; width:1600px; height:1000px; background:#E3E4E0;
  font-family:"Archivo","Noto Sans SC",sans-serif; color:#101418; overflow:hidden; }
.sheet div, .sheet svg.partfig, .sheet .statefig { position:absolute; }
.prodname { font-size:44.0px; font-weight:700; line-height:1.045; font-stretch:86%; white-space:nowrap; }
.desc { font-size:28.0px; font-weight:500; line-height:1.214; color:#4B5057; white-space:nowrap; }
.head { font-size:44.0px; font-weight:700; line-height:1.045; font-stretch:86%; white-space:nowrap; }
.partname { font-size:28.0px; font-weight:700; line-height:1.214; white-space:nowrap; }
.partname .count { margin-left:23.75px; }
.stepno { font-size:44.0px; font-weight:700; line-height:1.045; }
.steptext { font-size:44.0px; font-weight:700; line-height:1.045; width:420px; }
.rule { height:3px; background:#101418; }
.warndot { width:24px; height:24px; border-radius:50%; background:#D4470C; }
.warn { font-size:44.0px; font-weight:700; line-height:1.045; white-space:nowrap; }
.warn .warntext { margin-left:23.75px; }
</style>
</head>
<body>
<div class="sheet">

<svg width="0" height="0" style="position:absolute">
<defs>
<g id="fig-seat">
  <rect x="0" y="0" width="23" height="3" fill="#101418"/>
  <rect x="1" y="1" width="2" height="1" fill="#E3E4E0"/><rect x="4" y="1" width="2" height="1" fill="#E3E4E0"/><rect x="9" y="1" width="2" height="1" fill="#E3E4E0"/><rect x="12" y="1" width="2" height="1" fill="#E3E4E0"/><rect x="17" y="1" width="2" height="1" fill="#E3E4E0"/><rect x="20" y="1" width="2" height="1" fill="#E3E4E0"/>
</g>
<g id="fig-leg">
  <rect x="0" y="0" width="5" height="7" fill="#101418"/>
  <rect x="0" y="5" width="2" height="1" fill="#E3E4E0"/><rect x="3" y="5" width="2" height="1" fill="#E3E4E0"/>
</g>
<g id="fig-screw">
  <rect x="0" y="0" width="4" height="3" fill="#101418"/>
  <rect x="1" y="1" width="2" height="1" fill="#E3E4E0"/>
  <rect x="1" y="3" width="2" height="4" fill="#101418"/>
</g>
<g id="fig-wrench">
  <rect x="0" y="0" width="2" height="9" fill="#101418"/>
  <rect x="0" y="9" width="6" height="2" fill="#101418"/>
</g>
</defs>
</svg>
<div class="prodname" style="left:40.0px;top:40.0px">三脚凳</div>
<div class="desc" style="left:40.0px;top:107.75px">组装说明</div>
<div class="head" style="left:40.0px;top:182.5px">零件</div>
<svg class="partfig" style="left:40.0px;top:277.5px" viewBox="0 0 23 3" width="184" height="24"><use href="#fig-seat"/></svg>
<div class="partname" style="left:271.5px;top:272.504px">凳面<span class="count">×1</span></div>
<svg class="partfig" style="left:40.0px;top:396.5px" viewBox="0 0 5 7" width="40" height="56"><use href="#fig-leg"/></svg>
<div class="partname" style="left:271.5px;top:407.504px">凳腿<span class="count">×3</span></div>
<svg class="partfig" style="left:40.0px;top:547.5px" viewBox="0 0 4 7" width="32" height="56"><use href="#fig-screw"/></svg>
<div class="partname" style="left:271.5px;top:558.504px">螺丝<span class="count">×6</span></div>
<svg class="partfig" style="left:40.0px;top:698.5px" viewBox="0 0 6 11" width="48" height="88"><use href="#fig-wrench"/></svg>
<div class="partname" style="left:271.5px;top:725.504px">内六角扳手<span class="count">×1</span></div>
<div class="head" style="left:840.0px;top:40.0px">组装步骤</div>
<div class="stepno" style="left:840.0px;top:131.5px">1</div>
<div class="steptext" style="left:887.5px;top:131.5px">凳面底面朝上，<br>平放在地面</div>
<div class="statefig" style="left:1332px;top:131.5px"><svg class="state" viewBox="-5.5 -4.25 28.5 14.59" width="228" height="116.7"><rect x="0" y="10" width="23" height="0.34" fill="#101418"/><use href="#fig-seat" transform="translate(0 7)"/></svg></div>
<div class="stepno" style="left:840.0px;top:250.25px">2</div>
<div class="steptext" style="left:887.5px;top:250.25px">取一根凳腿，<br>对准凳面的安装孔</div>
<div class="statefig" style="left:1332px;top:250.25px"><svg class="state" viewBox="-5.5 -4.25 28.5 14.59" width="228" height="116.7"><rect x="0" y="10" width="23" height="0.34" fill="#101418"/><use href="#fig-seat" transform="translate(0 7)"/><use href="#fig-leg" transform="translate(1 0)"/></svg></div>
<div class="stepno" style="left:840.0px;top:369.0px">3</div>
<div class="steptext" style="left:887.5px;top:369.0px">旋入 2 颗螺丝，<br>固定这根凳腿</div>
<div class="statefig" style="left:1332px;top:369.0px"><svg class="state" viewBox="-5.5 -4.25 28.5 14.59" width="228" height="116.7"><rect x="0" y="10" width="23" height="0.34" fill="#101418"/><use href="#fig-seat" transform="translate(0 7)"/><use href="#fig-leg" transform="translate(1 0)"/><use href="#fig-screw" transform="translate(4 7) rotate(180)"/><use href="#fig-screw" transform="translate(7 7) rotate(180)"/></svg></div>
<div class="stepno" style="left:840.0px;top:487.75px">4</div>
<div class="steptext" style="left:887.5px;top:487.75px">其余两根凳腿重复<br>步骤 2–3</div>
<div class="statefig" style="left:1332px;top:487.75px"><svg class="state" viewBox="-5.5 -4.25 28.5 14.59" width="228" height="116.7"><rect x="0" y="10" width="23" height="0.34" fill="#101418"/><use href="#fig-seat" transform="translate(0 7)"/><use href="#fig-leg" transform="translate(1 0)"/><use href="#fig-leg" transform="translate(9 0)"/><use href="#fig-leg" transform="translate(17 0)"/><use href="#fig-screw" transform="translate(4 7) rotate(180)"/><use href="#fig-screw" transform="translate(7 7) rotate(180)"/><use href="#fig-screw" transform="translate(12 7) rotate(180)"/><use href="#fig-screw" transform="translate(15 7) rotate(180)"/><use href="#fig-screw" transform="translate(20 7) rotate(180)"/><use href="#fig-screw" transform="translate(23 7) rotate(180)"/></svg></div>
<div class="stepno" style="left:840.0px;top:606.5px">5</div>
<div class="steptext" style="left:887.5px;top:606.5px">用内六角扳手锁紧<br>全部 6 颗螺丝</div>
<div class="statefig" style="left:1332px;top:606.5px"><svg class="state" viewBox="-5.5 -4.25 28.5 14.59" width="228" height="116.7"><rect x="0" y="10" width="23" height="0.34" fill="#101418"/><use href="#fig-seat" transform="translate(0 7)"/><use href="#fig-leg" transform="translate(1 0)"/><use href="#fig-leg" transform="translate(9 0)"/><use href="#fig-leg" transform="translate(17 0)"/><use href="#fig-screw" transform="translate(4 7) rotate(180)"/><use href="#fig-screw" transform="translate(7 7) rotate(180)"/><use href="#fig-screw" transform="translate(12 7) rotate(180)"/><use href="#fig-screw" transform="translate(15 7) rotate(180)"/><use href="#fig-screw" transform="translate(20 7) rotate(180)"/><use href="#fig-screw" transform="translate(23 7) rotate(180)"/><use href="#fig-wrench" transform="translate(-4 -4)"/></svg></div>
<div class="stepno" style="left:840.0px;top:725.25px">6</div>
<div class="steptext" style="left:887.5px;top:725.25px">翻转三脚凳，<br>平稳立于地面</div>
<div class="statefig" style="left:1332px;top:725.25px"><svg class="state" viewBox="-5.5 -4.25 28.5 14.59" width="228" height="116.7"><rect x="0" y="10" width="23" height="0.34" fill="#101418"/><use href="#fig-seat" transform="translate(0 0)"/><use href="#fig-leg" transform="translate(6 10) rotate(180)"/><use href="#fig-leg" transform="translate(14 10) rotate(180)"/><use href="#fig-leg" transform="translate(22 10) rotate(180)"/><use href="#fig-screw" transform="translate(0 3)"/><use href="#fig-screw" transform="translate(3 3)"/><use href="#fig-screw" transform="translate(8 3)"/><use href="#fig-screw" transform="translate(11 3)"/><use href="#fig-screw" transform="translate(16 3)"/><use href="#fig-screw" transform="translate(19 3)"/></svg></div>
<div class="rule" style="left:840.0px;top:892.25px;width:720px"></div>
<div class="warndot" style="left:840.0px;top:926px"></div>
<div class="warn" style="left:887.75px;top:916px">警示<span class="warntext">使用前确认所有螺丝锁紧</span></div>
</div>
</body>
</html>
