<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Basic version</title>
<style>body{font-family:Arial,sans-serif;background:#f3f4f6;text-align:center;padding:40px}
.cards{display:flex;gap:16px;justify-content:center}.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:24px;width:180px}
.num{font-size:36px;font-weight:700;background:linear-gradient(90deg,#7c3aed,#2563eb);-webkit-background-clip:text;color:transparent}
button{background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;border:0;border-radius:999px;padding:12px 28px}</style></head>
<body><h1>Quarterly Results Overview</h1><p>Empowering seamless growth, unlocking value across the business.</p>
<div class="cards"><div class="card"><div class="num">128.4</div>Revenue</div>
<div class="card"><div class="num">86.1</div>Cost</div><div class="card"><div class="num">412</div>Headcount</div></div>
<p>Share of population by settlement: a pie chart would go here (cities 47%, towns 29%, villages 15%, other 9%).</p>
<button>Get started</button></body></html>
