<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#F4F4F0}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<rect width="900" height="1200" fill="#F4F4F0"/>
<!-- thread and drops -->
<rect x="45" y="247.5" width="810" height="6" fill="#111111"/>
<rect x="109.5" y="247.5" width="6" height="67.5" fill="#111111"/>
<rect x="379.5" y="247.5" width="6" height="337.5" fill="#111111"/>
<rect x="833.2" y="247.5" width="6" height="607.5" fill="#111111"/>
<!-- beam: the light's path, bounded by the two tangent rays -->
<polygon points="180.0,426.6 456.3,607.0 256.0,767.2 137.7,450.0 180,450" fill="#F3B900" stroke="#111111" stroke-width="3"/>
<!-- rays continued past the object to the ground -->
<line x1="456.3" y1="607.0" x2="836.2" y2="855" stroke="#111111" stroke-width="3"/>
<line x1="256.0" y1="767.2" x2="288.8" y2="855" stroke="#111111" stroke-width="3"/>
<!-- shadow: the circle's projection on the ground line -->
<rect x="288.8" y="832.5" width="547.4" height="22.5" fill="#111111"/>
<!-- ground rule -->
<rect x="45" y="855" width="810" height="4" fill="#111111"/>
<!-- object and source: one edge treatment, none -->
<circle cx="382.5" cy="720" r="135" fill="#1D3E9E"/>
<rect x="45" y="315" width="135" height="135" fill="#D7281E"/>
<!-- masthead -->
<text x="45" y="79" font-family="'Noto Sans SC',sans-serif" font-size="32" font-weight="500" fill="#111111">市儿童科学馆</text>
<text x="855" y="79" text-anchor="end" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#111111">Light &amp; Shadow Lab</text>
<!-- title: one line, cap height two modules, no stroke touches another -->
<text x="45" y="215" font-family="'Noto Sans SC',sans-serif" font-size="132" font-weight="700" fill="#111111">光与影实验室</text>
<!-- part labels: one rule - each centred under its part, one baseline -->
<text x="112.5" y="905" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#111111">光</text>
<text x="382.5" y="905" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#111111">物</text>
<text x="562.5" y="905" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#111111">影</text>
<!-- ledger: one row per fact -->
<rect x="45" y="940" width="810" height="2" fill="#111111"/>
<text x="45" y="982" font-family="'Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#4A4A46">场次</text><text x="180" y="982" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#111111">每周六两场</text><text x="470" y="982" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#111111">10:00</text><text x="610" y="982" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#111111">14:00</text><rect x="45" y="996" width="810" height="1" fill="#111111"/><text x="45" y="1025" font-family="'Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#4A4A46">年龄</text><text x="180" y="1025" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#111111">适合 6–12 岁</text><rect x="45" y="1039" width="810" height="1" fill="#111111"/><text x="45" y="1068" font-family="'Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#4A4A46">票价</text><text x="180" y="1068" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#111111">¥45（含材料）</text><rect x="45" y="1082" width="810" height="1" fill="#111111"/><text x="45" y="1111" font-family="'Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#4A4A46">地点</text><text x="180" y="1111" font-family="'League Spartan','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#111111">市儿童科学馆二层实验厅</text>
<rect x="0" y="1136" width="900" height="64" fill="#111111"/>
<text x="45" y="1179" font-family="'Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#F4F4F0">周末特别场</text>
</svg></body></html>
