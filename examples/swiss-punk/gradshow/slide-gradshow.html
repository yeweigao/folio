<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>「别改了，就这样」2026 届视觉传达毕业展 — 主视觉</title>
<style>
  @font-face { font-family:'Archivo'; src:url('archivo-var.woff2') format('woff2'); font-weight:100 900; font-stretch:62% 125%; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#55585c; }
  .stage { position:relative; width:1600px; height:900px; overflow:hidden; background:#ECEEEF; color:#0B0B0C;
           font-family:'Archivo','Noto Sans SC','Noto Sans CJK SC',sans-serif; }
  svg.films { position:absolute; left:0; top:0; }
  .dwrap { position:absolute; white-space:nowrap; }
  .slipcopy { position:absolute; left:0; top:0; color:#1560D6; mix-blend-mode:multiply; white-space:nowrap; }
  .live { position:relative; white-space:nowrap; }
  .han-display { font-family:'Noto Sans SC','Noto Sans CJK SC',sans-serif; font-weight:900; line-height:1; }
  .han-display span { display:inline-block; }
  /* The fullwidth comma's mark sits in the left of its em cell; the cell's advance is
     cut to the mark's own width so 就 follows tight on the same baseline (judge G1). */
  .han-display .comma { display:inline-block; width:0.38em; }
  .desc { position:absolute; font-size:24px; font-weight:600; color:#4F555C; white-space:nowrap; }
  .tlabel { position:absolute; font-size:30px; font-weight:600; white-space:nowrap; font-feature-settings:'tnum' 1; }
  .fact { position:absolute; font-size:39.6px; font-weight:800; line-height:1; white-space:nowrap; font-feature-settings:'tnum' 1; }
  .fig { font-weight:300; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="films" width="1600" height="900" viewBox="0 0 1600 900">
    <!-- Film 0: the thread carries the date range alone — its two real endpoints,
         two steps, no third step invented (judge G4). No screen (judge G5: the dotted
         改 is deleted), no + / target marks (judge G6). -->
    <polyline points="820,520 1192,520 1192,660.4 1492,660.4"
              fill="none" stroke="#0B0B0C" stroke-width="4.5"/>
  </svg>

  <!-- descriptor (verbatim from the brief) -->
  <div class="desc" style="left:36px; top:44px;">2026 届视觉传达毕业展</div>

  <!-- The title. Line 1 is ONE stepped line: all three glyphs upright on a single declared
       per-glyph increment (judge G3) — step = one grid row (c + gutter = 140.4) / (3 glyphs − 1)
       = 70.2, so the line descends exactly one row. Its blue is ONE complete film of the line,
       slipped once by half the step vector (35.1, 35.1) — recomputed for this subject:
       at Han stroke density a full-step slip interleaves the film with the next glyph;
       half the step diagonal keeps the film on its own glyphs, clear of their counters.
       Line 2 is set flat, in register, no copy — and the comma stands in the string itself,
       tight before 就 on the same baseline (judge G1). -->
  <div class="dwrap han-display" style="left:36px; top:96px; font-size:150px;">
    <div class="slipcopy" id="line1-slip"></div>
    <div class="live" id="line1"></div>
  </div>
  <div class="dwrap han-display" style="left:36px; top:486px; font-size:150px;">
    <div class="live"><span class="comma">，</span>就这样</div>
  </div>

  <!-- thread labels, flush left under each riser: the range's two halves, in order -->
  <div class="tlabel" style="left:820px; top:552px;"><span class="fig">2026</span>年<span class="fig">11</span>月<span class="fig">28</span>日</div>
  <div class="tlabel" style="left:1192px; top:692.4px;"><span class="fig">12</span>月<span class="fig">6</span>日</div>

  <!-- facts, set from the bottom margin up: the full range verbatim, the venue,
       the headcount (moved off the thread into the flat block, judge G4),
       and the organiser in black at fact size (judge G2) -->
  <div class="fact" style="left:36px; top:664px;"><span class="fig">2026</span>年<span class="fig">11</span>月<span class="fig">28</span>日—<span class="fig">12</span>月<span class="fig">6</span>日</div>
  <div class="fact" style="left:36px; top:714px;">学院美术馆</div>
  <div class="fact" style="left:36px; top:764px;">参展 <span class="fig">86</span> 人</div>
  <div class="fact" style="left:36px; top:814px;">主办：江城设计学院</div>
</div>

<script>
const $ = id => document.getElementById(id);
const STEP = 70.2;                 // declared: 140.4 / (3 − 1), from 别改了's three glyphs
const SLIP = { x: STEP / 2, y: STEP / 2 }; // declared: half the step vector — derived above, from this title's Han density
function splitGlyphs(el, word, step) {
  [...word].forEach((ch, i) => {
    const s = document.createElement('span'); s.textContent = ch;
    if (step) s.style.transform = `translateY(${i * step}px)`;
    el.appendChild(s);
  });
}
async function init() {
  await document.fonts.load('900 100px "Noto Sans CJK SC"');
  await document.fonts.ready;
  // Line 1: one stepped line, one film. No rotation anywhere; no per-glyph private offsets.
  splitGlyphs($('line1'), '别改了', STEP);
  splitGlyphs($('line1-slip'), '别改了', STEP);
  $('line1-slip').style.transform = `translate(${SLIP.x}px, ${SLIP.y}px)`;
  document.title = 'done';
}
init();
</script>
</body>
</html>
