<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" version="1.1" role="img" aria-labelledby="poster-title poster-description">
  <title id="poster-title">KONBIN STAGE — 17.07</title>
  <desc id="poster-description">An isometric open-air stage made from editable type and shared-edge colored architecture. KONBIN STAGE. 17.07. OPEN AIR. WE MAKE NOISE. RINA VEIL. LAGO. MOTIF CLUB. NEON PALMS.</desc>
  <!-- FONTS -->
  <rect x="0" y="0" width="900" height="1200" fill="#FFDF06" />
  <g id="isometric-architecture" shape-rendering="geometricPrecision">
    <g id="left-ink-pier">
