      <polygon points="480,888.5 870,722.75 870,912.75 480,1078.5" fill="#FFFFF3" />
      <g id="white-title-bridge-front" transform="matrix(1 .425 0 1 50 705.75)" aria-label="KONBIN">
        <text id="title-konbin" fill="#000000" font-family="Study Condensed" font-weight="700" font-size="126.5" xml:space="preserve" x="13" y="146">KONBIN</text>
