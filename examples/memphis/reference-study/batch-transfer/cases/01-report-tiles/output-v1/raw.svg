<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Eksplorasi Ruang Kota — Laporan Proyek Komunikasi Visual</title>
<desc id="desc">A visual communication report by Nadia Putri, Studio Sekolah, 2027. Two study groups appear beside a two-column field of eight geometric tiles.</desc>
<!-- FONTS -->
<rect width="1280" height="720" fill="#343D9F"/>
<text x="52.000" y="64" font-family="Study Sans, sans-serif" font-size="23" font-weight="400" fill="#F8F6ED">Laporan Proyek Komunikasi Visual</text>
<text x="41.220" y="210" font-family="Study Light, sans-serif" font-size="110" font-weight="100" fill="#F8F6ED" letter-spacing="-2.5">Eksplorasi</text>
<text x="46.750" y="326" font-family="Study Sans, sans-serif" font-size="112" font-weight="900" fill="#F8F6ED" letter-spacing="-4">Ruang Kota</text>
<text x="52.000" y="430" font-family="Study Sans, sans-serif" font-size="32" font-weight="700" fill="#F8F6ED">Observasi</text>
<text x="52" y="470" font-family="Study Sans, sans-serif" font-size="20" font-weight="400" fill="#F8F6ED">
<tspan x="52" dy="0">Mengamati tanda, warna, dan</tspan>
<tspan x="52" dy="28">kebiasaan di ruang publik sebagai</tspan>
<tspan x="52" dy="28">dasar sistem komunikasi visual.</tspan>
</text>
<text x="480.000" y="430" font-family="Study Sans, sans-serif" font-size="32" font-weight="700" fill="#F8F6ED">Eksperimen</text>
<text x="480" y="470" font-family="Study Sans, sans-serif" font-size="20" font-weight="400" fill="#F8F6ED">
<tspan x="480" dy="0">Menguji bentuk dan bahasa visual</tspan>
<tspan x="480" dy="28">melalui prototipe yang dekat dengan</tspan>
<tspan x="480" dy="28">kehidupan sehari-hari.</tspan>
</text>
<text x="52.000" y="650" font-family="Study Sans, sans-serif" font-size="26" font-weight="700" fill="#F8F6ED">Nadia Putri</text>
<text x="52.000" y="681" font-family="Study Sans, sans-serif" font-size="20" font-weight="400" fill="#F8F6ED">Studio Sekolah</text>
