  <text class="label" x="350" y="686">LOWER ROOM</text>
  <text class="names" x="350" y="754"><tspan x="350" y="754">Alba Phase</tspan><tspan x="350" y="811">Dorian East</tspan><tspan x="350" y="868">NEX</tspan></text>
</g>
