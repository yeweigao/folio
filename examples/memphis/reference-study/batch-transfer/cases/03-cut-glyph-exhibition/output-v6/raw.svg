<title id="poster-title">共生设计展 — COEXIST DESIGN EXHIBITION</title>
<desc id="poster-description">共生主题的切割字形海报，绿色与黑色双场。左侧为连笔白色共、生构字；右侧以小拼块、日期切口、紫色弯钩和橙色双碗腰体组成另一组共生结构。</desc>
