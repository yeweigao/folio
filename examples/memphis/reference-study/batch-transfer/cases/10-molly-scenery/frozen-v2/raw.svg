<desc id="poster-description">ART IN EVERYDAY LIFE. 2027.04.17—05.05，10:00–20:00，城市艺术中心 · 一层展厅，免费入场。把街角的颜色、声音与相遇，变成每个人都能参与的艺术现场。</desc>
