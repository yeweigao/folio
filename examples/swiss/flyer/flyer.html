<style>
@font-face{font-family:Noto;src:url('fonts/NotoSansSC-Regular.woff2') format('woff2');font-style:normal;font-weight:400;font-display:block}

:root{--ink:#161815;--white:#fff;--muted:#646860;--line:#BAC0B5;--moss:#67735F}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--white)}
body{font-family:Inter,Noto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

h1,h2,p,figure,figcaption{margin:0;font-weight:400}
.live{position:absolute;white-space:nowrap}
.identity{left:100px;top:80px;font-family:Noto,sans-serif;font-size:240px;font-weight:700;line-height:1;letter-spacing:0}
.brand-name{left:100px;top:395px;font-family:Inter,sans-serif;font-size:40px;font-weight:500;line-height:1.25;letter-spacing:0}

.scope{font-family:Noto,sans-serif;font-size:24px;line-height:1.25}
.translation{margin-top:14px;font-family:Inter,sans-serif;font-size:19px;font-weight:500;line-height:1.25}
.sample{margin-top:45px;font-family:Noto,sans-serif;font-size:19px;line-height:1.25;color:var(--muted)}
.divider{position:absolute;left:100px;top:480px;width:800px;height:1.1px;background:var(--line)}
.statement{left:100px;top:510px;font-family:Noto,sans-serif;font-size:80px;font-weight:700;line-height:1.12;letter-spacing:0}
.copy{left:100px;top:635px;font-family:Noto,sans-serif;font-size:28px;line-height:1.5;letter-spacing:0}
.material{position:absolute;left:0;top:760px;width:1000px;height:658.918919px;overflow:hidden}
.material img{position:absolute;top:0;left:0;width:1000px;height:602px;display:block;object-fit:cover;object-position:50% 52%}
.provenance-band{position:absolute;left:0;top:602px;width:1000px;height:56.918919px;background:var(--ink);color:var(--white)}
.asset-caption{left:100px;top:16px;font-family:Noto,sans-serif;font-size:18px;line-height:1.25}
.ai-caption{left:653.333333px;top:16px;font-family:Inter,Noto,sans-serif;font-size:18px;line-height:1.25}
@page{size:148mm 210mm;margin:0}
@media print{
 html,body{width:148mm;height:210mm;overflow:hidden;background:#fff}
 body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .flyer{transform:scale(.5593700787);transform-origin:top left;break-after:avoid;break-inside:avoid}
}

<body>
<main class="flyer" aria-label="岩序茶席体验概念推广样张">

    <p class="scope">茶席体验</p>

  <figure class="material">
